---
- name: Install passive script watchdog
  ansible.builtin.template:
    src: script-watchdog.py.j2
    dest: /usr/bin/script-watchdog
    owner: root
    group: root
    mode: "0755"

- name: Configure script watchdog runtime directory
  ansible.builtin.template:
    src: script-watchdog.tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/script-watchdog.conf
    owner: root
    group: root
    mode: "0644"

- name: Create script watchdog runtime directory
  ansible.builtin.file:
    path: "{{ script_watchdog_state_dir }}"
    state: directory
    owner: "{{ script_watchdog_state_owner }}"
    group: "{{ script_watchdog_state_group }}"
    mode: "{{ script_watchdog_state_mode }}"

- name: Ensure Telegraf configuration directory exists
  ansible.builtin.file:
    path: /etc/telegraf/telegraf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Telegraf script watchdog collector
  ansible.builtin.template:
    src: script-watchdog-telegraf.conf.j2
    dest: /etc/telegraf/telegraf.d/script-watchdog.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart Telegraf after configuring script watchdog
