---
# Use only on a disposable EL 9 or Rocky 10 host/container.
- name: Configure a disposable mail relay fixture
  hosts: all
  vars:
    postfix_relay_hostname: relay.example.org
    postfix_relay_bounce_address: bounces@example.org
    postfix_relay_envelope_senders: [sender@example.org]
    postfix_relay_imap_port: 1143
    postfix_relay_imap_password_hash: '{PLAIN}integration-password'
    postfix_relay_bounce_mode: local
    postfix_relay_account:
      host: smtp.example.org
      port: 587
      username: galaxy
      password: fake-password
      rate_delay: 6
  roles:
    - usegalaxy-eu.postfix-relay
