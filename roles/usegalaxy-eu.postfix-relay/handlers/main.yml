---
- name: Rebuild local aliases using the configured database backend
  ansible.builtin.command: newaliases
  listen: Validate and restart Postfix

- name: Check Postfix configuration
  ansible.builtin.command: postfix check
  changed_when: false
  listen: Validate and restart Postfix

- name: Restart Postfix
  ansible.builtin.service:
    name: postfix
    state: restarted
  listen: Validate and restart Postfix
  when: postfix_relay_manage_services | bool

- name: Check Dovecot configuration
  ansible.builtin.command: doveconf -n
  changed_when: false
  listen: Validate and restart Dovecot

- name: Restart Dovecot
  ansible.builtin.service:
    name: dovecot
    state: restarted
  listen: Validate and restart Dovecot
  when: postfix_relay_manage_services | bool

- name: Check rsyslog configuration
  ansible.builtin.command: rsyslogd -N1
  changed_when: false
  listen: Validate and restart rsyslog

- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
  listen: Validate and restart rsyslog
  when: postfix_relay_manage_services | bool

- name: Restart mail relay Telegraf
  ansible.builtin.service:
    name: telegraf
    state: restarted
  when: postfix_relay_manage_services | bool
