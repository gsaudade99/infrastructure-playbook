---
- name: Require a supported dedicated relay host and explicit configuration
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - >-
        ansible_distribution_major_version == '9'
        or (ansible_distribution == 'Rocky' and ansible_distribution_major_version == '10')
      - postfix_relay_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]+[.][A-Za-z0-9-]+$')
      - postfix_relay_account is mapping
      - postfix_relay_tls_mode in ['starttls', 'implicit']
      - postfix_relay_bounce_mode in ['local', 'external']
      - postfix_relay_interfaces | length > 0
      - postfix_relay_trusted_networks | length > 0
      - postfix_relay_bounce_address == '' or postfix_relay_bounce_address is match('^[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+$')
      - postfix_relay_bounce_mode != 'local' or postfix_relay_bounce_address | length > 0
      - postfix_relay_envelope_senders | length == 0 or postfix_relay_bounce_address | length > 0
      - postfix_relay_bounce_user is match('^[a-z][a-z0-9-]+$')
      - postfix_relay_bounce_home is match('^/[A-Za-z0-9_/-]+$')
      - postfix_relay_queue_lifetime is match('^[1-9][0-9]*[dhw]$')
      - postfix_relay_log_retention_days | int > 0
      - postfix_relay_message_size_limit | int > 0
      - postfix_relay_imap_port | int > 0
      - postfix_relay_imap_port | int < 65536
    fail_msg: Configure the university account, hostname, trusted clients and selected bounce mode before applying this role.

- name: Validate upstream account settings without exposing credentials
  ansible.builtin.assert:
    that:
      - postfix_relay_account.host is match('^[A-Za-z0-9][A-Za-z0-9.-]+$')
      - postfix_relay_account.port | int > 0
      - postfix_relay_account.port | int < 65536
      - postfix_relay_account.username is match('^[^:\s]+$')
      - postfix_relay_account.password | length > 0
      - postfix_relay_account.password is not search('[\r\n]')
      - postfix_relay_account.rate_delay | int > 0
  no_log: true

- name: Require a single-line Dovecot password hash
  ansible.builtin.assert:
    that:
      - postfix_relay_imap_password_hash is match('^\{[A-Za-z0-9-]+\}[^:\s]+$')
  no_log: true
  when: postfix_relay_bounce_mode == 'local'

- name: Validate envelope sender mappings
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+$')
  loop: "{{ postfix_relay_envelope_senders }}"
