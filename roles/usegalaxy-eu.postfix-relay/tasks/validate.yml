---
- name: Require a supported dedicated relay host and explicit configuration
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
      - >-
        (ansible_distribution == 'Debian' and ansible_distribution_major_version == '12')
        or (ansible_os_family == 'RedHat' and ansible_distribution_major_version == '9')
        or (ansible_distribution == 'Rocky' and ansible_distribution_major_version == '10')
      - postfix_relay_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]+[.][A-Za-z0-9-]+$')
      - postfix_relay_accounts | length > 0
      - postfix_relay_accounts | map(attribute='name') | unique | length == postfix_relay_accounts | length
      - postfix_relay_interfaces | length > 0
      - postfix_relay_trusted_networks | length > 0
      - postfix_relay_bounce_address is match('^[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+$')
      - postfix_relay_bounce_user is match('^[a-z][a-z0-9-]+$')
      - postfix_relay_bounce_home is match('^/[A-Za-z0-9_/-]+$')
      - postfix_relay_queue_lifetime is match('^[1-9][0-9]*[dhw]$')
      - postfix_relay_log_retention_days | int > 0
      - postfix_relay_message_size_limit | int > 0
      - postfix_relay_imap_port | int > 0
      - postfix_relay_imap_port | int < 65536
    fail_msg: Configure the relay accounts, hostname, trusted clients and bounce mailbox before applying this role.

- name: Validate upstream account settings without exposing credentials
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9_]*$')
      - item.host is match('^[A-Za-z0-9][A-Za-z0-9.-]+$')
      - item.port | int > 0
      - item.port | int < 65536
      - item.username is match('^[^:\s]+$')
      - item.password | length > 0
      - item.password is not search('[\r\n]')
      - item.rate_delay | int > 0
      - item.weight | int > 0
      - item.weight | int <= 100
  loop: "{{ postfix_relay_accounts }}"
  no_log: true

- name: Require a single-line Dovecot password hash
  ansible.builtin.assert:
    that:
      - postfix_relay_imap_password_hash is match('^\{[A-Za-z0-9-]+\}[^:\s]+$')
  no_log: true

- name: Validate envelope sender mappings
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+$')
  loop: "{{ postfix_relay_envelope_senders }}"
