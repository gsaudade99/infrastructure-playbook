---
- name: Check available Postfix lookup types
  ansible.builtin.command: postconf -m
  register: postfix_relay_map_types
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Require text lookup support
  ansible.builtin.assert:
    that:
      - "'texthash' in postfix_relay_map_types.stdout_lines"
  when: not ansible_check_mode

- name: Read chroot settings for services that access relay lookup files
  ansible.builtin.command: "postconf -h -F {{ item }}/chroot"
  loop:
    - smtp/inet
    - cleanup/unix
    - rewrite/unix
  register: postfix_relay_chroot_settings
  changed_when: false
  when: not ansible_check_mode

- name: Allow lookup services to access host configuration files
  ansible.builtin.command:
    argv:
      - postconf
      - -F
      - "{{ item.item }}/chroot=n"
  loop: "{{ postfix_relay_chroot_settings.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.stdout | default('n') != 'n'
  changed_when: true
  notify: Validate and restart Postfix

- name: Check transport-wide pacing support
  ansible.builtin.command: postconf -d default_transport_rate_delay
  changed_when: false
  when: not ansible_check_mode

- name: Read outbound SMTP process settings
  ansible.builtin.command: "postconf -h -F smtp/unix/{{ item }}"
  loop:
    - process_limit
    - chroot
  register: postfix_relay_smtp_settings
  changed_when: false
  when: not ansible_check_mode

- name: Use a single unchrooted outbound SMTP process
  ansible.builtin.command:
    argv:
      - postconf
      - -F
      - "smtp/unix/{{ item.item }}={{ '1' if item.item == 'process_limit' else 'n' }}"
  loop: "{{ postfix_relay_smtp_settings.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.stdout | default('') != ('1' if item.item == 'process_limit' else 'n')
  changed_when: true
  notify: Validate and restart Postfix

- name: Check for a previously managed local mailbox
  ansible.builtin.stat:
    path: /etc/dovecot/galaxy-users
  register: postfix_relay_previous_local_mailbox

- name: Install private upstream credential table
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/galaxy-sasl
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  notify: Validate and restart Postfix

- name: Install envelope sender mappings
  ansible.builtin.template:
    src: sender_canonical.j2
    dest: /etc/postfix/galaxy-sender-canonical
    owner: root
    group: root
    mode: '0644'
  notify: Validate and restart Postfix

- name: Install bounce recipient mappings
  ansible.builtin.template:
    src: virtual.j2
    dest: /etc/postfix/galaxy-virtual
    owner: root
    group: root
    mode: '0644'
  notify: Validate and restart Postfix
  when: postfix_relay_bounce_mode == 'local'

- name: Configure the dedicated Postfix relay
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: '0644'
  notify: Validate and restart Postfix

- name: Allow inbound delivery only to the public bounce address
  ansible.builtin.copy:
    dest: /etc/postfix/galaxy-bounce-access
    content: "{{ postfix_relay_bounce_address }} OK\n"
    owner: root
    group: root
    mode: '0644'
  notify: Validate and restart Postfix
  when: postfix_relay_bounce_mode == 'local'

- name: Remove previous randomized outbound transports
  ansible.builtin.blockinfile:
    path: /etc/postfix/master.cf
    marker: '# {mark} Galaxy outbound transports'
    state: absent
  notify: Validate and restart Postfix

- name: Find obsolete per-account credentials from the previous role configuration
  ansible.builtin.find:
    paths: /etc/postfix
    patterns: galaxy-sasl-*
    file_type: file
  register: postfix_relay_obsolete_credentials

- name: Remove obsolete per-account credentials
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ postfix_relay_obsolete_credentials.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Validate and restart Postfix
