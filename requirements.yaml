---
collections:
  # community.general 12.0.0+ requires ansible-core >= 2.17,
  # 13.0.0+ requires >= 2.18 - stay on 11.x until ansible-core is bumped.
  - name: community.general
    version: 11.4.9
    source: https://galaxy.ansible.com
  # amazon.aws 10.0.0+ requires ansible-core >= 2.17 - stay on 9.x until then.
  - name: amazon.aws
    version: 9.5.2
    source: https://galaxy.ansible.com
    type: galaxy
  # community.docker 5.0.0+ requires ansible-core >= 2.17 - stay on 4.x until then.
  - name: community.docker
    version: 4.8.8
    source: https://galaxy.ansible.com
    type: galaxy
  - name: grafana.grafana
    version: 6.1.0
  - name: ansible.posix
    source: https://github.com/ansible-collections/ansible.posix.git
    version: 2.2.2
    type: git
  - name: community.rabbitmq
    version: 1.7.0
    source: https://galaxy.ansible.com
    type: galaxy
  - name: devsec.hardening
    version: 10.6.0
    source: https://galaxy.ansible.com
    type: galaxy
  - name: usegalaxy_eu.handy
    version: 3.3.0
    source: https://galaxy.ansible.com
  - name: ansible.windows
    version: 3.8.0
    source: https://galaxy.ansible.com
  - name: community.mongodb
    version: 1.8.0
    source: https://galaxy.ansible.com
  # community.crypto 3.0.0+ requires ansible-core >= 2.17 - stay on 2.x until then.
  - name: community.crypto
    version: 2.26.9

roles:
  # devsec.hardening (>= 10.x) provides the os_hardening/ssh_hardening roles,
  # the standalone dev-sec.os-hardening/dev-sec.ssh-hardening galaxy roles have
  # been discontinued upstream (repo switched to collection layout with 7.0.0).
  - name: devops.tomcat7
    version: 1.0.0
  - name: dj-wasabi.telegraf
    # retrieve from GitHub (0.15.0 fixes the expired influxdata GPG key
    # rejected by the rpm backend on EL10)
    src: https://github.com/dj-wasabi/ansible-telegraf
    version: 0.15.0
  # Pinned to the tip of the `new-subdomain-layout` branch: the subdomain
  # welcome-page iframe check must use the bare URL, not the `.html` suffix
  # used by main (0.12.x), which 404s for galaxyproject.org/bare/ URLs.
  - name: galaxyproject.galaxy
    src: https://github.com/galaxyproject/ansible-galaxy
    version: ede09c4db04f37cbd51b9de060e70db58d6a2681
  - name: galaxyproject.cvmfs
    src: https://github.com/usegalaxy-eu/ansible-cvmfs
    version: master
  - name: galaxyproject.proftpd
    version: 0.3.3
  - name: usegalaxy_eu.ansible_nginx_upload_module
    version: 1.1.0
  - name: usegalaxy-eu.nginx
    src: https://github.com/usegalaxy-eu/ansible-nginx
    version: master
  - name: galaxyproject.nginx
    version: 1.0.2
  - name: galaxyproject.postgresql
    version: 1.1.8
  - name: usegalaxy-eu.ansible-postgresql
    src: https://github.com/usegalaxy-eu/ansible-postgresql
    version: main
  - name: geerlingguy.docker
    # 8.x installs the docker compose plugin by default; the standalone
    # docker-compose v1 binary is no longer installed (nothing depends on it).
    version: 8.0.0
  - name: geerlingguy.java
    version: 2.6.1
  - name: geerlingguy.jenkins
    version: 5.3.1
  - name: geerlingguy.repo-epel
    version: 3.1.2
  - name: influxdata.chrony
    src: https://github.com/usegalaxy-eu/ansible-chrony
    version: 0.1.1
  - name: galaxyproject.gxadmin
    version: 0.0.14
  - name: usegalaxy-eu.certbot
    src: https://github.com/usegalaxy-eu/ansible-certbot
    version: 0.1.13
  - name: usegalaxy_eu.galaxy_systemd
    version: 2.5.0
  - name: usegalaxy-eu.dynmotd
    src: https://github.com/usegalaxy-eu/ansible-dynmotd
    version: 0.1.0
  - name: galaxyproject.tiaas2
    version: 2.2.4
  - name: usegalaxy-eu.autoupdates
    src: https://github.com/usegalaxy-eu/ansible-autoupdates
    version: 0.0.1
  - name: usegalaxy_eu.htcondor
    src: https://github.com/usegalaxy-eu/ansible-htcondor
    version: 2.2.0
  - name: grycap.htcondor
    src: https://github.com/usegalaxy-eu/ansible-htcondor-grycap
    version: 33ea3aafd9c5d33a1063534e0604631696c052f9
  - name: usegalaxy-eu.update-hosts
    src: https://github.com/usegalaxy-eu/ansible-update-hosts
    version: 0.4.0
  - name: usegalaxy_eu.gie_proxy
    version: 0.2.0
  - name: usegalaxy-eu.autofs
    src: https://github.com/usegalaxy-eu/ansible-autofs
    version: 1.4.2
  - name: usegalaxy_eu.fs_maintenance
    version: 0.1.0
    src: https://github.com/usegalaxy-eu/ansible-fs-maintenance
  - name: usegalaxy_eu.rustus
    src: https://github.com/usegalaxy-eu/ansible-rustus
    version: 1.0.3
  # Pinned to the `ulimits` branch: tag 1.5.0 removed the container
  # `ulimits` support required by group_vars/mq.yml (rabbitmq_ulimits).
  - name: usegalaxy_eu.rabbitmqserver
    version: ulimits
    src: https://github.com/usegalaxy-eu/ansible-rabbitmq
  - name: usegalaxy_eu.influxdbserver
    version: 2.0.0
  - name: usegalaxy_eu.flower
    version: 2.2.0
  - name: usegalaxy_eu.walle
    version: 131a52c20af5f0dca0f2979fe88a427c251b5675
    src: https://github.com/usegalaxy-eu/WallE
  # `geerlingguy.pip` is here only because it is a dependency of
  # `paprikant.beacon` and because no version has been pinned when declaring
  # the dependency, the role is affected by this bug:
  # https://forum.ansible.com/t/role-import-from-github-results-in-master-release-not-the-tag-release-breaking-installs/1856
  # Remove `geerlingguy.pip` from this list when the bug above has been fixed.
  - name: geerlingguy.pip
    version: 3.1.2
  - name: paprikant.beacon
    src: https://github.com/gsaudade99/ansible-role-beacon/ # CHANGE ME ONCE MERGED https://github.com/Paprikant/ansible-role-beacon/pull/4
    version: 2639596e9c0af8084272e60579ccddeb5a411bbf
  - name: paprikant.beacon-importer
    src: https://github.com/usegalaxy-eu/ansible-role-beacon_importer
  - name: galaxyproject.miniconda
    version: 0.3.4
  - name: usegalaxy_eu.tpv_auto_lint
    version: 0.4.6
  # artis3n.tailscale 5.0.0+ requires ansible-core >= 2.18 - stay on 4.x.
  - name: artis3n.tailscale
    version: v4.6.0
  - name: dokku_bot.ansible_dokku
    src: https://github.com/usegalaxy-eu/ansible-dokku
    version: 1402ff80a1ac44f076dd9be92ef9c8de0fbd7b1d
  - src: https://github.com/usegalaxy-eu/ansible-traefik
    name: usegalaxy_eu.traefik
    version: 3.0.0
  - src: https://github.com/usegalaxy-eu/ansible-fw-glxeu-generic
    name: usegalaxy_eu.firewall
    version: 2.1.0
  - name: usegalaxy_eu.dnbd3
    src: https://github.com/usegalaxy-eu/ansible-dnbd3
    version: main
  - name: usegalaxy_eu.tftp
    src: https://github.com/usegalaxy-eu/ansible-tftp
    version: main
  - name: geerlingguy.apache
    version: 4.2.1
  - name: usegalaxy_eu.ansible_tpv_broker
    src: https://github.com/usegalaxy-eu/ansible-tpv-broker
    version: main
  - name: geerlingguy.swap
    version: 2.1.0
  - name: usegalaxy_eu.disable_memory_overcommit
    version: 0.0.1
    src: https://github.com/usegalaxy-eu/ansible-disable-memory-overcommit
  - name: geerlingguy.apache-php-fpm
    version: 1.1.0
  - name: geerlingguy.php
    version: 6.1.0
  - name: usegalaxy_eu.ssh_manager
    version: 0.0.2
  - name: l3d.restic
    version: v0.9.3
    src: https://github.com/roles-ansible/ansible_role_restic
  - name: usegalaxy_eu.rocky_security_repository
    src: https://github.com/usegalaxy-eu/ansible-rocky-security-repository
    version: v0.1.0
  - name: usegalaxy_eu.ucsc_genome_browser
    version: 91f26a70678ce67f088a4a3db1454496a24564d0
    src: https://github.com/usegalaxy-eu/ansible-ucsc-genome-browser
